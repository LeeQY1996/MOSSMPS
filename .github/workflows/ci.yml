name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.13']
    env:
      JULIA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: MOSSMPS
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LeeQY1996/MOSSQuantum
          ref: b06f0d7283c8ceac6001a718bdcbc016daaadbca
          path: MOSSQuantum
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Test MOSSMPS
        shell: julia --startup-file=no {0}
        run: |
          using Pkg
          Pkg.activate(mktempdir())
          packages = ["MOSSQuantum", "MOSSMPS"]
          Pkg.develop([PackageSpec(path=joinpath(pwd(), name)) for name in packages])
          Pkg.test("MOSSMPS")
